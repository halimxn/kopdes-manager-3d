<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototipe Tugas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Prototipe layar tugas varian B (database + panel samping) dengan tampilan Hari ini ala varian C.
   Keputusan pemilik 18 Okt 2026. Hanya mode terang; data fiktif berlabel Contoh. */
:root {
  color-scheme: light;
  --kertas: #fff; --sisi: #f7f7f8; --hover: #f2f2f4; --garis: #ececef; --garis-kuat: #dfdfe5;
  --tinta: #1d1e2c; --redup: #6b6e80; --pudar: #9a9cab;
  --aksen: #546fff; --aksen-muda: #eef1ff; --aksen-garis: #c9d2ff;
  --ok: #157f4b; --ok-muda: #e6f4ec; --late: #c23a1f; --late-muda: #fbeae6; --warn: #8a5a00; --warn-muda: #fbf1d9;
  --abu-muda: #f0f0f3;
  --bayang-panel: -16px 0 40px -28px rgb(29 30 44 / .35);
  --lebar-sb: 248px; --lebar-peek: 440px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--kertas); color: var(--tinta); font: 14px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--aksen); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 17px; height: 17px; flex: none; }

/* ---------- Kerangka ---------- */
.app { display: grid; position: relative; overflow: hidden; grid-template-columns: var(--lebar-sb) minmax(0, 1fr) 0; height: 100vh; height: 100dvh; transition: grid-template-columns .2s ease; }
.app.peek-buka { grid-template-columns: var(--lebar-sb) minmax(0, 1fr) var(--lebar-peek); }

/* Sidebar */
.sb { background: var(--sisi); border-right: 1px solid var(--garis); padding: 10px 8px; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; }
.sb-ruang { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 8px; border-radius: 8px; font-weight: 600; margin-bottom: 6px; }
.sb-ruang:hover { background: var(--hover); }
.logo { width: 26px; height: 26px; border-radius: 8px; background: var(--aksen); color: #fff; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; }

.sb-i { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; padding: 0 8px; border-radius: 8px; color: #45475a; text-align: left; font-size: 13.5px; text-decoration: none; }
.sb-i:hover { background: var(--hover); }
.sb-i[aria-current="page"] { background: #e9e9ee; color: var(--tinta); font-weight: 600; }
.sb-i svg { color: var(--pudar); }
.sb-i[aria-current="page"] svg { color: var(--aksen); }
.sb-i .n { margin-left: auto; font-size: 11.5px; color: var(--pudar); font-weight: 500; }

.sb-i kbd { margin-left: auto; font: 500 10.5px "Plus Jakarta Sans"; color: var(--pudar); }
.sb-judul { font-size: 11.5px; font-weight: 600; color: var(--pudar); padding: 16px 8px 4px; display: flex; align-items: center; justify-content: space-between; }
.sb-judul button { width: 22px; height: 22px; border-radius: 6px; color: var(--pudar); }
.sb-judul button:hover { background: var(--hover); }
.kp { width: 8px; height: 8px; border-radius: 50%; display: inline-block; font-size: 0; flex: none; margin: 0 5px; }
.sb-anak { padding-left: 28px; }
.sb-anak .sb-i { min-height: 28px; font-size: 12.5px; color: var(--redup); }
.sb-bawah { margin-top: auto; padding-top: 12px; }

/* Area utama */
.utama { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.atas { height: 48px; display: flex; align-items: center; gap: 6px; padding: 0 16px 0 20px; flex: none; }
.jejak { color: var(--redup); font-size: 12.5px; display: flex; gap: 6px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; }
.jejak b { color: var(--tinta); font-weight: 500; }
.atas .kanan { margin-left: auto; display: flex; gap: 2px; align-items: center; }
.cari-atas { display: flex; align-items: center; gap: 8px; height: 32px; width: 220px; padding: 0 10px; border-radius: 8px; background: var(--sisi); color: var(--pudar); }
.cari-atas:focus-within { background: #fff; box-shadow: 0 0 0 1px var(--garis-kuat); }
.cari-atas input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; font-size: 13px; }
.cari-atas kbd { font: 500 11px "Plus Jakarta Sans"; }
.ikon-t { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--redup); }
.ikon-t:hover { background: var(--hover); }
.tombol-menu { display: none; }
.gulir { flex: 1; overflow-y: auto; overflow-x: hidden; }
.dalam { max-width: 960px; padding: 12px 48px 64px; margin: 0 auto; }
.app.peek-buka .dalam { padding: 12px 28px 64px; }
.judul-hal { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 16px 0 4px; display: flex; align-items: center; gap: 12px; line-height: 1.2; }
.contoh { font-size: 11px; font-weight: 500; color: var(--pudar); border: 1px solid var(--garis-kuat); padding: 1px 7px; border-radius: 5px; }
.ringkas { color: var(--redup); font-size: 13.5px; margin: 0 0 24px; }
.ringkas b { color: var(--tinta); font-weight: 600; }
.ringkas .m { color: var(--late); font-weight: 600; }

/* Tab + alat */
.alat { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; border-bottom: 1px solid var(--garis); margin-bottom: 4px; }
.tabs { display: flex; gap: 2px; }
.tab { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 10px; color: var(--redup); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13.5px; }
.tab svg { width: 15px; height: 15px; }
.tab[aria-selected="true"] { color: var(--tinta); border-color: var(--tinta); }
.alat .kanan { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.pilih { height: 30px; border: 0; border-radius: 7px; padding: 0 8px; color: var(--redup); font-size: 12.5px; background: none; cursor: pointer; }
.pilih:hover { background: var(--hover); }
.pilih.on { color: var(--aksen); background: var(--aksen-muda); font-weight: 600; }
.cari-kecil { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border-radius: 7px; color: var(--redup); }
.cari-kecil:focus-within { background: var(--hover); }
.cari-kecil input { border: 0; outline: 0; background: none; width: 120px; font-size: 12.5px; }
.baru { height: 32px; padding: 0 14px; border-radius: 8px; background: var(--aksen); color: #fff; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; }
.baru:hover { background: #4560f0; }
.catatan-tab { font-size: 12.5px; color: var(--redup); background: var(--sisi); border-radius: 10px; padding: 14px 16px; margin-top: 12px; }

/* Tabel (grid) */
.kolom, .baris { display: grid; grid-template-columns: 28px minmax(0, 1fr) 112px 132px 88px; align-items: center; column-gap: 10px; padding: 0 8px; }
.app.peek-buka .kolom, .app.peek-buka .baris { grid-template-columns: 28px minmax(0, 1fr) 104px 30px 76px; }
.app.peek-buka .baris .orang .nama { display: none; }
.kolom { height: 32px; font-size: 12px; color: var(--pudar); font-weight: 500; border-bottom: 1px solid var(--garis); }
.kolom span { display: flex; align-items: center; gap: 5px; }
.kolom svg { width: 13px; height: 13px; }
.grup-k { display: flex; align-items: center; gap: 6px; height: 48px; padding: 16px 4px 0; font-weight: 600; font-size: 13px; width: 100%; text-align: left; }
.grup-k .panah { width: 18px; height: 18px; display: grid; place-items: center; color: var(--pudar); transition: transform .15s; }
.grup-k[aria-expanded="false"] .panah { transform: rotate(-90deg); }
.grup-k .jml { color: var(--pudar); font-weight: 500; font-size: 12px; }
.grup-k .prog { width: 72px; height: 4px; border-radius: 2px; background: var(--garis); overflow: hidden; margin-left: 4px; }
.grup-k .prog i { display: block; height: 100%; background: var(--ok); }
.baris { min-height: 46px; border-bottom: 1px solid #f3f3f5; cursor: pointer; border-radius: 8px; }
.baris:hover { background: #fafafb; }
.baris.pilih-ini { background: var(--aksen-muda); box-shadow: inset 2px 0 0 var(--aksen); }
.baris .judul { display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left; font-weight: 500; }
.baris .judul .t { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.baris.selesai .judul .t { color: var(--pudar); text-decoration: line-through; }
.baris .meta-hp { display: none; }
.subp { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--pudar); font-weight: 500; flex: none; }
.cincin { width: 13px; height: 13px; border-radius: 50%; background: conic-gradient(var(--aksen) calc(var(--p) * 1%), var(--garis-kuat) 0); -webkit-mask: radial-gradient(circle 3.5px, transparent 98%, #000 100%); mask: radial-gradient(circle 3.5px, transparent 98%, #000 100%); }
.tambah-baris { opacity: 0; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; color: var(--pudar); font-size: 12.5px; width: 100%; text-align: left; border-radius: 6px; }
.tambah-baris:hover { background: var(--hover); color: var(--redup); }
section:hover > .tambah-baris, .tambah-baris:focus-visible { opacity: 1; }
@media (hover: none) { .tambah-baris { opacity: 1; } }
.kosong { padding: 32px 8px; color: var(--redup); text-align: center; font-size: 13px; }

/* Properti */
.cek { width: 18px; height: 18px; border-radius: 50%; border: 1.6px solid #c4c5d0; display: grid; place-items: center; flex: none; background: #fff; position: relative; }
.cek::before { content: ""; position: absolute; inset: -13px; }
.cek[aria-checked="true"] { background: var(--ok); border-color: var(--ok); }
.cek[aria-checked="true"]::after { content: ""; width: 8px; height: 4px; border: solid #fff; border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
.cek.p-mendesak { border-color: var(--late); background: var(--late-muda); }
.cek.p-tinggi { border-color: #d39b2a; background: var(--warn-muda); }
/* Status cukup titik berwarna + teks abu; latar berwarna membuat daftar ramai. */
.st { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--redup); white-space: nowrap; }
.st i { width: 8px; height: 8px; border-radius: 50%; background: #c9cad4; flex: none; }
.st.proses i { background: var(--aksen); }
.st.selesai i { background: var(--ok); }
.st.dibatalkan { color: var(--pudar); text-decoration: line-through; }
.pr { font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; color: var(--redup); white-space: nowrap; }
.pr svg { width: 13px; height: 13px; }
.pr.mendesak { color: var(--late); }
.bendera { color: var(--late); display: inline-flex; flex: none; }
.bendera svg { width: 13px; height: 13px; }
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-weight: 600; color: #4a4c5e; background: #ececf0; flex: none; }
.orang { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--redup); white-space: nowrap; min-width: 0; }
.orang .nama { overflow: hidden; text-overflow: ellipsis; }
.tgl { font-size: 13px; white-space: nowrap; color: var(--redup); }
.tgl.lewat { color: var(--late); font-weight: 500; }
.tgl.dekat { color: var(--tinta); font-weight: 500; }

/* ---------- Hari ini ---------- */
.fokus { max-width: 720px; margin: 0 auto; padding: 12px 24px 64px; }
.tambah-cepat { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-bottom: 28px; padding: 0 8px 0 14px; border: 1px solid var(--garis-kuat); border-radius: 12px; box-shadow: 0 1px 2px rgb(29 30 44 / .04); }
.tambah-cepat:focus-within { border-color: var(--aksen); box-shadow: 0 0 0 3px var(--aksen-muda); }
.tambah-cepat .plus { width: 20px; height: 20px; border-radius: 50%; background: var(--aksen); color: #fff; display: grid; place-items: center; font-size: 15px; flex: none; }
.tambah-cepat input { flex: 1; border: 0; outline: 0; min-width: 0; height: 46px; background: none; }
.tambah-cepat kbd { font: 500 11px "Plus Jakarta Sans"; color: var(--redup); border: 1px solid var(--garis-kuat); border-radius: 5px; padding: 1px 6px; }
.petunjuk { display: none; }
.petunjuk code { font: 600 11.5px "Plus Jakarta Sans"; color: var(--aksen); background: var(--aksen-muda); padding: 0 5px; border-radius: 4px; }
.bagian { margin-bottom: 28px; }
.bagian h2 { font-size: 13px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; padding: 0 6px; height: 32px; }
.bagian h2 .n { color: var(--pudar); font-weight: 500; }
.bagian h2.merah { color: var(--late); }
.bagian h2 button { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--aksen); padding: 4px 8px; border-radius: 6px; }
.bagian h2 button:hover { background: var(--aksen-muda); }
.kartu { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 6px; border-radius: 8px; align-items: start; cursor: pointer; }
.kartu:hover { background: #fafafb; }
.kartu.pilih-ini { background: var(--aksen-muda); }
.kartu .cek { margin-top: 2px; }
.kartu .jdl { font-weight: 500; text-align: left; }
.kartu.selesai .jdl { color: var(--pudar); text-decoration: line-through; }
.kartu .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--pudar); align-items: center; }
.kartu .meta .kp { margin: 0 2px 0 0; }
.kartu .meta > span { display: inline-flex; align-items: center; gap: 5px; }
.kartu .kanan { grid-row: 1 / 3; grid-column: 3; display: flex; align-items: center; gap: 10px; align-self: center; }

/* ---------- Panel samping ---------- */
.peek { border-left: 1px solid var(--garis); background: #fff; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--bayang-panel); min-width: 0; }
.app:not(.peek-buka) .peek { visibility: hidden; }
.pk-atas { height: 48px; display: flex; align-items: center; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--garis); flex: none; color: var(--redup); font-size: 12px; }
.pk-atas .posisi { margin-left: 6px; }
.pk-atas .kanan { margin-left: auto; display: flex; gap: 2px; }
.pk-isi { padding: 20px 28px 40px; overflow-y: auto; flex: 1; }
.pk-kode { font-size: 12px; color: var(--pudar); font-weight: 600; letter-spacing: .02em; }
.pk-judul { font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; margin: 4px 0 16px; outline: 0; border-radius: 6px; }
.pk-judul:focus { background: var(--sisi); box-shadow: 0 0 0 4px var(--sisi); }
.props { display: grid; grid-template-columns: 112px minmax(0, 1fr); row-gap: 0; font-size: 13px; margin: 0 0 16px; }
.props dt { color: var(--redup); display: flex; align-items: center; gap: 8px; min-height: 34px; }
.props dt svg { width: 15px; height: 15px; color: var(--pudar); }
.props dd { margin: 0; display: flex; align-items: center; min-height: 34px; position: relative; }
.prop-ubah { width: 100%; min-height: 34px; border: 0; border-radius: 6px; padding: 0 8px; background: none; cursor: pointer; appearance: none; -webkit-appearance: none; }
.prop-ubah:hover { background: var(--hover); }
.prop-ubah:focus { outline: 2px solid var(--aksen-garis); background: #fff; }
.prop-tampil { position: absolute; left: 8px; pointer-events: none; display: flex; align-items: center; }
select.prop-ubah { color: transparent; }
select.prop-ubah option { color: var(--tinta); }
input[type=date].prop-ubah { color: transparent; }
input[type=date].prop-ubah::-webkit-calendar-picker-indicator { opacity: 0; position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
.pk h3 { font-size: 12px; font-weight: 600; color: var(--redup); margin: 8px 0 6px; display: flex; justify-content: space-between; align-items: center; }
.pk h3 span { color: var(--pudar); font-weight: 500; }
.sublist { list-style: none; margin: 0 0 6px; padding: 0; }
.sublist li { display: flex; align-items: center; gap: 10px; min-height: 34px; font-size: 13px; border-radius: 6px; padding: 0 4px; }
.sublist li:hover { background: var(--sisi); }
.sublist .cek { width: 16px; height: 16px; border-radius: 5px; }
.sublist li.ok span { color: var(--pudar); text-decoration: line-through; }
.sub-tambah { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 4px; margin-bottom: 20px; color: var(--pudar); }
.sub-tambah input { border: 0; outline: 0; flex: 1; font-size: 13px; background: none; min-width: 0; }
.akt { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; font-size: 12.5px; }
.akt li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
.akt b { font-weight: 600; }
.akt time { color: var(--pudar); font-size: 11.5px; margin-left: 6px; }
.komentar { margin-top: 16px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--garis-kuat); border-radius: 10px; padding: 6px 6px 6px 10px; }
.komentar:focus-within { border-color: var(--aksen); }
.komentar input { flex: 1; border: 0; outline: 0; font-size: 13px; min-width: 0; height: 32px; }
.komentar button { height: 32px; padding: 0 12px; border-radius: 8px; background: var(--aksen); color: #fff; font-weight: 600; font-size: 12.5px; }
.pk-catatan { font-size: 13.5px; color: var(--redup); margin: 0 0 24px; padding-top: 16px; border-top: 1px solid var(--garis); }

/* Bilah bawah ponsel + selubung */
.fab { display: none; }
.selubung { display: none; }

/* ---------- 1024–1279: panel menimpa daftar ---------- */
@media (max-width: 1279px) {
  .app.peek-buka { grid-template-columns: var(--lebar-sb) minmax(0, 1fr) 0; }
  .peek { position: fixed; top: 0; right: 0; bottom: 0; width: var(--lebar-peek); z-index: 30; transform: translateX(100%); transition: transform .2s ease; }
  .app.peek-buka .peek { transform: none; }
  /* Lebar sedang: Prioritas cukup lewat warna cincin centang dan panel. */
  .kolom, .baris, .app.peek-buka .kolom, .app.peek-buka .baris { grid-template-columns: 28px minmax(0, 1fr) 104px 120px 84px; }
  .k-prio, .app.peek-buka .k-prio { display: none; }
  .app.peek-buka .baris .orang .nama { display: inline; }
  .dalam, .app.peek-buka .dalam { padding: 12px 32px 64px; }
  .app.peek-buka .alat .kanan { order: 0; width: auto; margin: 0 0 0 auto; }
}
/* ---------- < 1024: sidebar jadi laci, panel layar penuh ---------- */
@media (max-width: 1023px) {
  .app, .app.peek-buka { grid-template-columns: minmax(0, 1fr); }
  .sb { position: fixed; inset: 0 auto 0 0; width: 288px; z-index: 40; transform: translateX(-100%); transition: transform .2s ease; box-shadow: 16px 0 40px -20px rgb(29 30 44 / .35); }
  body.laci-buka .sb { transform: none; }
  body.laci-buka .selubung { display: block; position: fixed; inset: 0; z-index: 35; background: rgb(29 30 44 / .3); }
  .tombol-menu { display: grid; }
  .atas { padding-left: 8px; }
  .peek { width: 100%; }
  .dalam, .app.peek-buka .dalam { padding: 8px 24px 96px; }
}
/* ---------- < 768: tabel jadi daftar kartu ---------- */
@media (max-width: 767px) {
  .judul-hal { font-size: 26px; }
  /* Ponsel: cari berupa ikon yang melebar saat disentuh. */
  .cari-atas { width: 44px; height: 44px; padding: 0 13px; background: none; transition: width .15s; }
  .cari-atas input { width: 0; }
  .cari-atas kbd { display: none; }
  .cari-atas:focus-within { width: 200px; background: var(--sisi); }
  .dalam, .app.peek-buka .dalam, .fokus { padding: 4px 16px 112px; }
  .alat { flex-wrap: wrap; border-bottom: 0; }
  .tabs { width: 100%; border-bottom: 1px solid var(--garis); overflow-x: auto; scrollbar-width: none; }
  .alat .kanan, .app.peek-buka .alat .kanan { order: 0; margin: 8px 0 4px; width: 100%; flex-wrap: wrap; gap: 6px; justify-content: flex-start; }
  .pilih { height: 40px; }
  .alat .baru { display: none; }
  .kolom { display: none; }
  .baris, .app.peek-buka .baris { grid-template-columns: 28px minmax(0, 1fr); grid-template-areas: "c j" "c m"; row-gap: 4px; padding: 10px 4px; min-height: 56px; align-items: start; }
  .baris > .cek { grid-area: c; margin-top: 2px; }
  .baris > .judul { grid-area: j; }
  .baris > .judul .t { white-space: normal; }
  .baris > .sel { display: none; }
  .baris .meta-hp { grid-area: m; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12px; color: var(--redup); }

.f-label { display: block; margin: 16px 0 8px; font-size: 13.5px; font-weight: 600; color: var(--tinta); }

@media (max-width: 1279px) { body[data-kulit="lekuk"] .ringkas-atas { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

/* ---------- Beranda: rutin diutamakan, agenda tervisualisasi ---------- */

.menu-baru button { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; min-height: 56px; padding: 6px 10px; border-radius: 16px; text-align: left; }
.menu-baru button:hover, .menu-baru button:focus-visible { background: var(--aksen-muda); }

.beranda-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; align-items: start; margin-bottom: 18px; }

.kartu-b { position: relative; background: #fff; border-radius: 26px; padding: 18px 16px 16px; }

.kartu-b > p { margin: 2px 44px 14px 4px; font-size: 12.5px; color: var(--redup); }
.kartu-b > p .m { color: var(--late); font-weight: 600; }

/* Rutin harian: kartu ungu penuh agar menjadi pusat perhatian. */
.kartu-rutin { background: #9d89f2; color: #fff; }
.kartu-rutin > p { color: rgb(255 255 255 / .88); }
.rutin-progres { height: 8px; margin: 0 4px 14px; border-radius: 999px; background: rgb(255 255 255 / .28); overflow: hidden; }

.rutin-daftar li:hover { background: rgb(255 255 255 / .24); }

.kartu-rutin .av { box-shadow: 0 0 0 2px rgb(255 255 255 / .6); }

/* Linimasa agenda. */
.linimasa { display: grid; gap: 10px; }
.agenda { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 10px; }
.agenda-jam { padding-top: 12px; text-align: right; font-variant-numeric: tabular-nums; }

.agenda-jenis { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; }
.agenda-jenis svg { width: 14px; height: 14px; }
.agenda-judul { font-size: 14.5px; font-weight: 700; }
.agenda-tempat { font-size: 12.5px; color: var(--redup); }
.agenda-kaki { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; min-height: 32px; }

.aksi-kecil { display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 999px; background: #fff; color: var(--tinta); font-size: 12.5px; font-weight: 600; text-decoration: none; }
.aksi-kecil.gelap { background: var(--tinta); color: #fff; }
.lencana-ok { font-size: 12px; font-weight: 600; color: var(--ok); }
.garis-kini { display: flex; align-items: center; gap: 8px; padding-left: 14px; font-size: 11.5px; font-weight: 700; color: var(--late); }
.garis-kini::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--late); }
.garis-kini::after { content: ""; flex: 1; height: 2px; border-radius: 2px; background: var(--late); opacity: .5; }

/* Ringkasan tindakan dan pita minggu. */
.daftar-ringkas { display: grid; gap: 4px; }
.ringkas-baris { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: 50px; padding: 6px 8px; border-radius: 16px; text-align: left; }
.ringkas-baris:hover { background: var(--aksen-muda); }

.tgl-chip.dekat { background: #fff1c9; }
.ringkas-judul { font-size: 13.5px; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.jenis-ikon { width: 30px; height: 30px; border-radius: 10px; display: inline-grid; place-items: center; background: color-mix(in srgb, var(--w, #9d89f2) 35%, #fff); flex: none; }

.titik-titik { display: flex; gap: 3px; height: 7px; }
.titik-titik i { width: 7px; height: 7px; border-radius: 50%; background: var(--w); }

/* Halaman Agenda. */

.saring-jenis button::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--w); }
.saring-jenis button[aria-pressed="true"] { background: var(--tinta); color: #fff; }
.agenda-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.jurnal-item { display: grid; gap: 6px; padding: 14px; margin-bottom: 8px; border-radius: 18px; background: #f7f3fe; }

.jurnal-item small { font-size: 12px; color: var(--redup); }

/* Formulir agenda/jurnal. */
.f-jenis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.f-jenis button { display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; border-radius: 16px; background: #fff; font-size: 13.5px; font-weight: 600; }

/* ---------- Interaksi: toast, letupan, konfeti, masuk, papan, kalender, palet, notifikasi ---------- */

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; display: flex; align-items: center; gap: 14px; max-width: min(520px, calc(100vw - 32px)); padding: 10px 10px 10px 18px; border-radius: 999px; background: #1d1b26; color: #fff; font-size: 13.5px; box-shadow: 0 18px 36px -14px rgb(29 27 38 / .6); transform: translate(-50%, 140%); opacity: 0; transition: transform .25s cubic-bezier(.2, .9, .3, 1.2), opacity .2s; pointer-events: none; }

@keyframes letup { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

.kartu-rutin { overflow: visible; }
.kartu-rutin.rayakan .rutin-progres i { background: linear-gradient(90deg, #fff, #fbd35f, #fff); }
.konfeti { position: absolute; top: 40%; z-index: 4; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; animation: konfeti 1.1s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes konfeti { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--x), calc(var(--y) + 220px)) rotate(var(--r)); opacity: 0; } }
@keyframes naik { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.masuk > :nth-child(2) { animation-delay: .04s; } .masuk > :nth-child(3) { animation-delay: .08s; } .masuk > :nth-child(4) { animation-delay: .12s; } .masuk > :nth-child(5) { animation-delay: .16s; } .masuk > :nth-child(n+6) { animation-delay: .2s; }
body[data-kulit="lekuk"] .kartu-b, body[data-kulit="lekuk"] .baris, .kartu-papan, .agenda-isi, .hari-pita, .ubin { transition: transform .15s ease, box-shadow .15s ease, background .15s; }

.kolom-papan, .kartu-papan { min-width: 0; }

.pop[hidden] { display: none; }
.pop-daftar { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; }
.pop-daftar li { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 14px; font-size: 14px; cursor: pointer; }
.pop-daftar li.aktif, .pop-daftar li:hover { background: var(--aksen-muda); }
.pop-daftar li[aria-selected="true"] { font-weight: 600; }
.pop-daftar li svg { width: 18px; height: 18px; margin-left: auto; color: var(--aksen); }
.pop-kal { width: 300px; padding: 6px; }
.pop-kal-kepala { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.pop-kal-kepala b { font-size: 14px; }
.pop-kal-kepala button { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; background: #f6f2fd; }
.pop-kal-kepala svg { width: 16px; height: 16px; }
.pop-cepat { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.pop-cepat button { height: 30px; padding: 0 12px; border-radius: 999px; background: var(--aksen-muda); color: var(--aksen); font-size: 12px; font-weight: 600; }
.pop-kal-hari, .pop-kal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.pop-kal-hari span { font-size: 11px; font-weight: 600; color: var(--pudar); padding-bottom: 4px; }
.pop-kal-grid button { height: 38px; border-radius: 12px; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
.pop-kal-grid button:hover { background: var(--aksen-muda); }
.pop-kal-grid button.ini { box-shadow: inset 0 0 0 1.5px var(--aksen); color: var(--aksen); font-weight: 700; }
.pop-kal-grid button.on { background: var(--aksen); color: #fff; box-shadow: none; }
.pop-jam { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 280px; max-height: 240px; overflow-y: auto; padding: 4px; }
.pop-jam button { height: 40px; border-radius: 12px; background: #f6f2fd; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pop-jam button:hover { background: var(--aksen-muda); }
.pop-jam button.on { background: var(--aksen); color: #fff; }

/* ---------- Modal ---------- */
.modal-latar { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 16px; background: rgb(29 27 38 / .4); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: naik .15s ease both; }
.modal-latar[hidden] { display: none; }
.modal { position: relative; width: min(400px, 100%); padding: 44px 24px 22px; border-radius: 30px; background: #fff; text-align: center; box-shadow: 0 40px 80px -30px rgb(29 27 38 / .6); animation: muncul .22s cubic-bezier(.2, .9, .3, 1.2) both; }
@keyframes muncul { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: none; } }
.modal-ikon { position: absolute; left: 50%; top: -30px; width: 64px; height: 64px; margin-left: -32px; display: grid; place-items: center; border-radius: 50%; background: var(--aksen); color: #fff; box-shadow: 0 0 0 8px #fff, 0 14px 24px -8px rgb(143 120 240 / .8); }
.modal-ikon.bahaya { background: #ff8b6a; box-shadow: 0 0 0 8px #fff, 0 14px 24px -8px rgb(255 139 106 / .8); }
.modal-ikon svg { width: 28px; height: 28px; }
.modal h2 { margin: 0 0 6px; font-size: 19px; font-weight: 700; }
.modal p { margin: 0 0 20px; font-size: 14px; color: var(--redup); line-height: 1.5; }
.modal-aksi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-aksi button { height: 50px; border-radius: 999px; font-size: 14px; font-weight: 600; }
.m-batal { background: #f3eefd; color: var(--tinta); }
.m-ya { background: var(--aksen); color: #fff; }
.m-ya.bahaya { background: #ff8b6a; }

/* Palet: kepala lavender dan pengelompokan hasil. */
.palet { border-radius: 30px; }
.palet-cari { margin: 10px; padding: 0 16px; border: 0; border-radius: 20px; background: #f3eefd; }
.palet-cari input { height: 54px; }
.palet-grup { padding: 10px 12px 4px; font-size: 11.5px; font-weight: 700; color: var(--pudar); text-transform: uppercase; letter-spacing: .06em; cursor: default; }
#palet-hasil li.palet-grup { display: block; min-height: 0; }

/* Panel: melayang di desktop, berlatar redup di tablet, lembar bawah di ponsel. */
.latar-peek { display: none; }
body[data-kulit="lekuk"] .peek { margin: 12px 12px 12px 0; border-radius: 28px; box-shadow: 0 30px 60px -30px rgb(29 27 38 / .5); }
body[data-kulit="lekuk"] .app:not(.peek-buka) .peek { margin: 0; }
@media (max-width: 1279px) {
  body[data-kulit="lekuk"] .peek { top: 12px; right: 12px; bottom: 12px; margin: 0; height: auto; transform: translateX(calc(100% + 24px)); }
  body[data-kulit="lekuk"] .app.peek-buka .peek { transform: none; }
  body[data-kulit="lekuk"] .app.peek-buka .latar-peek { display: block; position: fixed; inset: 0; z-index: 25; background: rgb(29 27 38 / .3); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
}
@media (max-width: 767px) {
  body[data-kulit="lekuk"] .peek { top: 5vh; left: 0; right: 0; bottom: 0; width: auto; border-radius: 28px 28px 0 0; transform: translateY(105%); }
  body[data-kulit="lekuk"] .pk-atas { position: relative; padding-top: 10px; height: 72px; }
  body[data-kulit="lekuk"] .pk-atas::before { content: ""; position: absolute; left: 50%; top: 8px; width: 44px; height: 5px; margin-left: -22px; border-radius: 999px; background: #d9d1f2; }

  .pantau { grid-template-columns: 30px minmax(0, 1fr) 58px auto; }
}
@media (prefers-reduced-motion: reduce) { .denyut, .modal, .modal-latar, .pop { animation: none; } .donat circle, .pilih-ikon { transition: none; } }

// ---------- Statistik tugas: garis lengkung seperti referensi ----------
function garisHalus(titik) {
  let d = `M${titik[0][0].toFixed(1)},${titik[0][1].toFixed(1)}`;
  for (let i = 0; i < titik.length - 1; i++) {
    const [x0, y0] = titik[i - 1] || titik[i];
    const [x1, y1] = titik[i];
    const [x2, y2] = titik[i + 1];
    const [x3, y3] = titik[i + 2] || titik[i + 1];
    d += ` C${(x1 + (x2 - x0) / 6).toFixed(1)},${(y1 + (y2 - y0) / 6).toFixed(1)} ${(x2 - (x3 - x1) / 6).toFixed(1)},${(y2 - (y3 - y1) / 6).toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
  }
  return d;
}

// Deret contoh deterministik; di aplikasi dihitung dari completed_at dan riwayat status.
function acak(benih) { let x = benih; return () => (x = (x * 9301 + 49297) % 233280) / 233280; }

}

  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${warna}" stop-opacity=".35"/><stop offset="1" stop-color="${warna}" stop-opacity="0"/></linearGradient></defs>${isi ? `<path d="${d} L${pts.at(-1)[0]},${h} L${pts[0][0]},${h} Z" fill="url(#${id})"/>` : ''}<path d="${d}" fill="none" stroke="${warna}" stroke-width="2" stroke-linecap="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="2.6" fill="${warna}"/></svg>`;

    <div class="segmen" role="group" aria-label="Rentang waktu">${Object.keys(RENTANG).map((k) => `<button type="button" data-rentang="${k}" aria-pressed="${S.rentang === k}">${k}</button>`).join('')}</div>
    <div class="grafik-bungkus" data-grafik="stat">
      <svg class="grafik-k" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik ${r.label}: ${aktif.map((x) => `${x.label} ${x.data.join(', ')}`).join('. ')}">
        <defs>${grad}<filter id="pendar" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        ${kisi}${lapisan}${sumbuX}
        <g class="silang" style="display:none"><line class="silang-garis" y1="${T}" y2="${H - B}"/>${aktif.map((x) => `<circle r="5" fill="${x.w}" stroke="#1d1b26" stroke-width="2" data-titik="${x.k}"/>`).join('')}</g>
      </svg>
      <div class="tooltip-k" hidden></div>
    </div>
    <div class="ks-seri" role="group" aria-label="Tampilkan seri">${seri.map((x) => `<button type="button" data-seri="${x.k}" aria-pressed="${!S.seriMati.has(x.k)}" style="--w:${x.w}">${x.label}</button>`).join('')}</div>
  </section>`;
}
function geserSilang(bungkus, clientX) {
  const gfx = GRAFIK[bungkus.dataset.grafik];
  if (!gfx) return;
  const svg = bungkus.querySelector('svg');
  const kotak = svg.getBoundingClientRect();
  const x = ((clientX - kotak.left) / kotak.width) * gfx.W;
  const i = Math.max(0, Math.min(gfx.n - 1, Math.round((x - gfx.L) / ((gfx.W - gfx.L - gfx.R) / (gfx.n - 1)))));
  const silang = svg.querySelector('.silang');
  silang.style.display = '';
  silang.querySelector('.silang-garis').setAttribute('x1', gfx.X(i));
  silang.querySelector('.silang-garis').setAttribute('x2', gfx.X(i));
  gfx.seri.forEach((sr) => { const c = silang.querySelector(`[data-titik="${sr.k}"]`); c.setAttribute('cx', gfx.X(i)); c.setAttribute('cy', gfx.Y(sr.data[i])); });
  const tip = bungkus.querySelector('.tooltip-k');
  tip.hidden = false;
  tip.innerHTML = `<b>${gfx.label(i)}</b>${gfx.seri.map((sr) => `<span style="--w:${sr.w}">${sr.label}<em>${sr.data[i]}</em></span>`).join('')}`;
  const px = (gfx.X(i) / gfx.W) * kotak.width;
  tip.style.left = Math.min(Math.max(px, 70), kotak.width - 70) + 'px';
}
function lepasSilang(bungkus) {
  bungkus.querySelector('.silang').style.display = 'none';
  bungkus.querySelector('.tooltip-k').hidden = true;
}
document.addEventListener('pointermove', (e) => { const b = e.target.closest?.('[data-grafik]'); if (b) geserSilang(b, e.clientX); });
document.addEventListener('pointerout', (e) => { const b = e.target.closest?.('[data-grafik]'); if (b && !b.contains(e.relatedTarget)) lepasSilang(b); });

// ---------- Panel kanan: beban PIC dan progres proyek ----------
function panelKanan() {
  const buka = TUGAS.filter((t) => !tutupStatus(t));
  const staf = Object.keys(ORANG);
  // Watchlist ala crypto: beban terbuka 7 hari; naik = beban bertambah (merah), turun = berkurang (hijau).
  const beban = staf.map((k, idx) => {
    const milik = buka.filter((t) => t.pic === k);
    const tren = deret(7, Math.max(0, milik.length + (idx % 2 ? -2 : 2)), milik.length, 2, 11 + idx * 7);
    tren[6] = milik.length;
    const ubah = tren[6] - tren[5];
    const kelas = ubah > 0 ? 'turun' : ubah < 0 ? 'naik' : 'datar';
    const warna = ubah > 0 ? '#fb7185' : ubah < 0 ? '#22c55e' : '#a897f5';
    return `<button class="pantau" type="button" data-saring-pic="${k}" aria-pressed="${S.pic === k}">${av(k)}<span class="pantau-nama"><b>${ORANG[k].lengkap}</b><small>${ORANG[k].jabatan}</small></span>${spark(tren, 58, 26, warna, false)}<span class="pantau-nilai"><b>${milik.length}</b><span class="delta ${kelas}">${ubah > 0 ? '▲' : ubah < 0 ? '▼' : '•'} ${Math.abs(ubah)}</span></span></button>`;
  }).join('');
  const totalBuka = buka.filter((t) => !t.rutin).length || 1;
  let sudut = 0;
  const kel = 2 * Math.PI * 38;
  const potong = PROYEK.map((pr) => {
    const n = buka.filter((t) => t.p === pr.id && !t.rutin).length;
    const panjang = (n / totalBuka) * kel;
    const seg = `<circle r="38" cx="50" cy="50" fill="none" stroke="${pr.w}" stroke-width="13" stroke-linecap="round" stroke-dasharray="${Math.max(0, panjang - 4)} ${kel}" stroke-dashoffset="${-sudut}" transform="rotate(-90 50 50)"/>`;
    sudut += panjang;
    return seg;
  }).join('');
  const proyekHtml = PROYEK.map((pr) => {
    const isi = TUGAS.filter((t) => t.p === pr.id && !t.rutin);
    const n = isi.filter((t) => t.st === 'selesai').length;
    const pct = isi.length ? Math.round((n / isi.length) * 100) : 0;
    const terbuka = isi.length - n;
    return `<button class="proyek-baris" type="button" data-tampil="proyek" data-proyek="${pr.id}"><span class="kp" style="background:${pr.w}"></span><span><b>${pr.nama}</b><small>${terbuka} terbuka · ${Math.round((terbuka / totalBuka) * 100)}% beban</small></span><span class="pct">${pct}%<i style="--p:${pct};--w:${pr.w}"></i></span></button>`;
  }).join('');
  return `<aside class="kolom-kanan" aria-label="Beban tim dan progres proyek">
    <section class="kartu-kanan bertakik"><h2>Beban per PIC</h2><p>Tugas terbuka · tren 7 hari · klik untuk menyaring</p><a class="takik-btn" href="#tim" aria-label="Kelola Tim"><svg><use href="#keluar"/></svg></a>${beban}</section>
    <section class="kartu-kanan bertakik"><h2>Sebaran proyek</h2><p>Porsi tugas terbuka dan progres selesai</p><button class="takik-btn" type="button" aria-label="Tambah proyek"><svg><use href="#plus"/></svg></button>
      <div class="donat"><svg viewBox="0 0 100 100" aria-hidden="true"><circle r="38" cx="50" cy="50" fill="none" stroke="#f1ecfd" stroke-width="13"/>${potong}</svg><span><b>${totalBuka}</b><small>terbuka</small></span></div>
      ${proyekHtml}</section>
  </aside>`;
}
// Semua saringan berasal dari satu keadaan (S) agar ubin, grafik, sidebar, dan daftar selalu sepakat.
function barisSaringan() {
  const c = [];
  if (S.status) c.push(['status', { rencana: 'Rencana', proses: 'Proses', lewat: 'Terlambat', selesai: 'Selesai' }[S.status]]);
  if (S.pic) c.push(['pic', `PIC: ${ORANG[S.pic].nama}`]);
  if (S.cari) c.push(['cari', `Cari: “${esc(S.cari)}”`]);
  if (!c.length) return '';
  return `<div class="saringan">Menyaring ${c.map(([k, l]) => `<button type="button" class="chip-saring" data-hapus-saring="${k}">${l}<span aria-hidden="true">✕</span><span class="sr">, hapus saringan</span></button>`).join('')}${c.length > 1 ? '<button type="button" class="hapus-semua" data-hapus-saring="semua">Hapus semua</button>' : ''}</div>`;
}

const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const jam = (j) => j.replace(':', '.');
const namaHari = (tgl) => HARI[new Date(tgl + 'T00:00').getDay()];
const tglPanjang = (tgl) => { const [, m, h] = tgl.split('-'); return `${namaHari(tgl)}, ${+h} ${['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'][+m - 1]}`; };
const urutAgenda = (a, b) => (a.tgl + a.mulai).localeCompare(b.tgl + b.mulai);

function menuBaru() {
  return `<div class="menu-baru" role="menu">
    <button type="button" role="menuitem" data-baru=""><span class="mb-ikon" style="--w:#9d89f2"><svg><use href="#semua"/></svg></span><span><b>Tugas baru</b><small>Ada PIC, tenggat, status</small></span></button>
    <button type="button" role="menuitem" data-agenda-baru><span class="mb-ikon" style="--w:#e9a6ec"><svg><use href="#waktu"/></svg></span><span><b>Agenda</b><small>Rapat, online, kunjungan, kegiatan</small></span></button>
    <button type="button" role="menuitem" data-jurnal-baru><span class="mb-ikon" style="--w:#5cc76e"><svg><use href="#catat"/></svg></span><span><b>Catat kegiatan</b><small>Hasil yang sudah terjadi</small></span></button>
  </div>`;
}

function kartuAgenda(a) {
  const j = JENIS[a.jenis];
  const lalu = a.tgl < HARI_INI || (a.tgl === HARI_INI && a.selesai <= JAM_KINI);
  const kini = a.tgl === HARI_INI && a.mulai <= JAM_KINI && a.selesai > JAM_KINI;
  const tercatat = JURNAL.some((x) => x.agenda === a.id);
  const aksi = lalu
    ? (tercatat ? '<span class="lencana-ok">Hasil tercatat</span>' : `<button class="aksi-kecil" type="button" data-catat-hasil="${a.id}">Catat hasil</button>`)
    : a.jenis === 'online' && a.tautan ? `<a class="aksi-kecil gelap" href="${esc(a.tautan)}" target="_blank" rel="noopener">Gabung</a>` : '';
  const tempat = a.jenis === 'online' ? 'Rapat online · tautan tersimpan' : esc(a.lokasi || '');
  return `<article class="agenda ${lalu ? 'lalu' : ''} ${kini ? 'kini' : ''}" style="--w:${j.w}">
    <div class="agenda-jam"><b>${jam(a.mulai)}</b><span>${jam(a.selesai)}</span></div>
    <div class="agenda-isi" data-agenda="${a.id}" tabindex="0" role="button" aria-label="${j.label}: ${esc(a.judul)}, ${jam(a.mulai)} sampai ${jam(a.selesai)}">
      <span class="agenda-jenis"><svg><use href="#${j.ikon}"/></svg>${j.label}${kini ? ' · sedang berlangsung' : ''}</span>
      <b class="agenda-judul">${esc(a.judul)}</b>
      <span class="agenda-tempat">${tempat}</span>
      <span class="agenda-kaki"><span class="tumpuk">${a.peserta.slice(0, 3).map(av).join('')}${a.peserta.length > 3 ? `<span class="av lebih">+${a.peserta.length - 3}</span>` : ''}</span>${aksi}</span>
    </div>
  </article>`;
}

function linimasa(daftar, tgl) {
  if (!daftar.length) return '<p class="kosong">Belum ada agenda. Tambahkan rapat, rapat online, kunjungan, atau kegiatan.</p>';
  let kiniDipasang = tgl !== HARI_INI;
  const garisKini = `<div class="garis-kini" aria-label="Sekarang ${jam(JAM_KINI)}"><span>${jam(JAM_KINI)}</span></div>`;
  const isi = daftar.map((a) => {
    let awal = '';
    if (!kiniDipasang && a.mulai > JAM_KINI) { awal = garisKini; kiniDipasang = true; }
    return awal + kartuAgenda(a);
  }).join('');
  return `<div class="linimasa">${isi}${kiniDipasang ? '' : garisKini}</div>`;
}

function pitaMinggu(pilih) {
  const awal = new Date(HARI_INI + 'T00:00');
  awal.setDate(awal.getDate() - ((awal.getDay() + 6) % 7));
  return `<div class="pita" role="group" aria-label="Pilih hari">${Array.from({ length: 7 }, (_, i) => {
    const d = new Date(awal); d.setDate(awal.getDate() + i);
    const tgl = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const isi = AGENDA.filter((a) => a.tgl === tgl).sort(urutAgenda);
    return `<button class="hari-pita ${tgl === pilih ? 'on' : ''} ${tgl === HARI_INI ? 'ini' : ''}" type="button" data-hari-agenda="${tgl}" aria-pressed="${tgl === pilih}" aria-label="${tglPanjang(tgl)}, ${isi.length} agenda"><small>${HARI[d.getDay()].slice(0, 3)}</small><b>${d.getDate()}</b><span class="titik-titik">${isi.slice(0, 4).map((a) => `<i style="--w:${JENIS[a.jenis].w}"></i>`).join('')}</span></button>`;
  }).join('')}</div>`;
}

        <ul class="rutin-daftar">${rutin.map((t) => `<li class="${t.st === 'selesai' ? 'ok' : ''} ${berikut === t ? 'berikut' : ''} ${S.dipilih === t.kode ? 'pilih-ini' : ''}" data-buka="${t.kode}">

// ---------- Papan: seret kartu antar status ----------
function kartuPapan(t) {
  const tg = labelTgl(t);
  const n = t.sub.filter((x) => x.ok).length;
  return `<article class="kartu-papan ${S.dipilih === t.kode ? 'pilih-ini' : ''}" draggable="true" data-seret="${t.kode}" data-buka="${t.kode}" tabindex="0" aria-label="${esc(t.judul)}, ${besar(t.st)}">
    <span class="tag ${t.pr}">${besar(t.pr)}</span>
    <b>${esc(t.judul)}</b>
    <span class="kaki-papan"><span class="tgl ${tg.kls}"><svg><use href="#hari"/></svg>${tg.teks}</span>${t.sub.length ? `<span><svg><use href="#semua"/></svg>${n}/${t.sub.length}</span>` : ''}${av(t.pic)}</span>
  </article>`;
}
function renderPapan(daftar) {
  const kolom = [['rencana', 'Rencana'], ['proses', 'Proses'], ['selesai', 'Selesai']];
  urutanAktif = [];
  return `<p class="petunjuk-papan">Seret kartu ke kolom lain untuk mengubah status. Di layar sentuh, buka kartu lalu ubah status.</p><div class="papan">${kolom.map(([k, l]) => {
    const isi = daftar.filter((t) => t.st === k).sort(urut);
    urutanAktif.push(...isi.map((t) => t.kode));
    return `<section class="kolom-papan" data-kolom="${k}" aria-label="Kolom ${l}"><header><span class="st ${k}"><i></i>${l}</span><span class="n">${isi.length}</span></header><div class="isi-kolom">${isi.map(kartuPapan).join('') || '<p class="kosong-kolom">Lepas tugas di sini</p>'}</div></section>`;
  }).join('')}</div>`;
}

// ---------- Kalender bulan berjalan ----------
function renderKalender(daftar) {
  const [y, m] = HARI_INI.split('-').map(Number);
  const offset = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const jml = new Date(y, m, 0).getDate();
  const sel = [];
  for (let i = 0; i < offset; i++) sel.push('<div class="kal-sel kosong-sel" aria-hidden="true"></div>');
  for (let d = 1; d <= jml; d++) {
    const tgl = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const tugas = daftar.filter((t) => t.tgl === tgl).sort(urut);
    const agenda = AGENDA.filter((a) => a.tgl === tgl).sort(urutAgenda);
    sel.push(`<div class="kal-sel ${tgl === HARI_INI ? 'ini' : ''}">
      <button class="kal-tgl" type="button" data-hari-agenda="${tgl}" aria-label="${tglPanjang(tgl)}: ${tugas.length} tugas, ${agenda.length} agenda">${d}</button>
      ${agenda.length ? `<span class="kal-titik">${agenda.slice(0, 4).map((a) => `<i style="--w:${JENIS[a.jenis].w}" title="${esc(a.judul)}"></i>`).join('')}</span>` : ''}
      ${tugas.slice(0, 2).map((t) => `<button class="kal-tugas ${lewat(t) ? 'telat' : ''} ${t.st === 'selesai' ? 'beres' : ''}" type="button" data-buka="${t.kode}">${esc(t.judul)}</button>`).join('')}
      ${tugas.length > 2 ? `<span class="kal-lagi">+${tugas.length - 2} tugas</span>` : ''}
      ${tugas.length ? `<span class="kal-n">${tugas.length}</span>` : ''}
    </div>`);
  }
  urutanAktif = daftar.slice().sort((a, b) => a.tgl.localeCompare(b.tgl)).map((t) => t.kode);
  return `<div class="kalender"><div class="kal-judul">${tglPanjang(HARI_INI).split(', ')[1].split(' ')[1]} ${y}<span>Klik tanggal untuk membuka agenda hari itu</span></div>
    <div class="kal-hari" aria-hidden="true">${['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map((h) => `<span>${h}</span>`).join('')}</div>
    <div class="kal-grid">${sel.join('')}</div></div>`;
}

// ---------- Toast dengan Batalkan ----------
let waktuToast;
function toast(pesan, batal) {
  const el = $('#toast');
  el.innerHTML = `<span>${pesan}</span>${batal ? '<button type="button" data-batal>Batalkan</button>' : ''}`;
  el.classList.add('tampil');
  S.batal = batal || null;
  clearTimeout(waktuToast);
  waktuToast = setTimeout(() => { el.classList.remove('tampil'); S.batal = null; }, 5000);
}

// ---------- Animasi kecil ----------
const gerakBoleh = () => !matchMedia('(prefers-reduced-motion: reduce)').matches;
function letupkan(kode) {
  if (!gerakBoleh()) return;
  document.querySelectorAll(`[data-cek="${kode}"]`).forEach((e) => e.classList.add('letup'));
}
function rayakanRutin() {
  const kartu = $('.kartu-rutin');
  if (!kartu) return;
  kartu.classList.add('rayakan');
  if (!gerakBoleh()) return;
  const warna = ['#fff', '#fbd35f', '#ecaeee', '#5cc76e', '#ff8b6a'];
  for (let i = 0; i < 28; i++) {
    const c = document.createElement('i');
    c.className = 'konfeti';
    c.style.cssText = `--x:${(Math.random() * 2 - 1) * 160}px;--y:${-60 - Math.random() * 120}px;--r:${Math.random() * 540}deg;background:${warna[i % warna.length]};left:${30 + Math.random() * 40}%;animation-delay:${Math.random() * 120}ms`;
    kartu.appendChild(c);
    setTimeout(() => c.remove(), 1300);
  }
}

// ---------- Palet perintah (Ctrl+K) ----------
function hasilPalet(q) {
  const cocok = (x) => x.toLowerCase().includes(q.toLowerCase());
  const tugas = q ? TUGAS.filter((t) => cocok(t.judul + ' ' + t.kode)).slice(0, 5).map((t) => ({ jenis: t.rutin ? 'Rutin' : 'Tugas', ikon: t.rutin ? 'ulang' : 'semua', label: t.judul, sub: `${labelTgl(t).teks} · ${ORANG[t.pic].nama}`, aksi: { buka: t.kode } })) : [];
  const agenda = q ? AGENDA.filter((a) => cocok(a.judul)).slice(0, 4).map((a) => ({ jenis: JENIS[a.jenis].label, ikon: JENIS[a.jenis].ikon, label: a.judul, sub: `${namaHari(a.tgl)} ${jam(a.mulai)}`, aksi: { agenda: a.id } })) : [];
  const halaman = [['hari', 'Hari ini', 'hari'], ['rutin', 'Rutin harian', 'ulang'], ['agenda', 'Agenda', 'waktu'], ['saya', 'Tugas saya', 'saya'], ['semua', 'Semua tugas', 'semua']]
    .filter(([, l]) => !q || cocok(l)).map(([k, l, i]) => ({ jenis: 'Halaman', ikon: i, label: l, aksi: { tampil: k } }));
  const buat = [{ jenis: 'Buat', ikon: 'plus', label: q ? `Tugas baru: “${q}”` : 'Tugas baru', aksi: { baru: q } }, { jenis: 'Buat', ikon: 'waktu', label: 'Agenda baru', aksi: { agendaBaru: true } }];
  return [...tugas, ...agenda, ...halaman, ...buat];
}
function renderDaftarPalet() {
  const hasil = hasilPalet(S.paletQ || '');
  S.paletI = Math.min(S.paletI, hasil.length - 1);
  const grupDari = (j) => (j === 'Tugas' || j === 'Rutin' ? 'Tugas' : j === 'Halaman' ? 'Pindah ke' : j === 'Buat' ? 'Buat baru' : 'Agenda');
  $('#palet-hasil').innerHTML = hasil.map((h, i) => `${i === 0 || grupDari(hasil[i - 1].jenis) !== grupDari(h.jenis) ? `<li class="palet-grup" role="presentation">${grupDari(h.jenis)}</li>` : ''}<li id="palet-${i}" role="option" aria-selected="${i === S.paletI}" data-palet-i="${i}"><span class="palet-ikon"><svg><use href="#${h.ikon}"/></svg></span><span><b>${esc(h.label)}</b>${h.sub ? `<small>${esc(h.sub)}</small>` : ''}</span><em>${h.jenis}</em></li>`).join('') || '<li class="kosong">Tidak ada hasil.</li>';
  $('#palet-q').setAttribute('aria-activedescendant', `palet-${S.paletI}`);
  $('#palet-' + S.paletI)?.scrollIntoView({ block: 'nearest' });
}
function bukaPalet() {
  S.palet = true; S.paletQ = ''; S.paletI = 0; S.pilihBaru = ''; S.notif = false;
  document.body.classList.remove('laci-buka');
  const el = $('#palet');
  el.hidden = false;
  el.innerHTML = `<div class="palet" role="dialog" aria-modal="true" aria-label="Cari dan perintah">
    <div class="palet-cari"><svg><use href="#cari"/></svg><input id="palet-q" role="combobox" aria-expanded="true" aria-controls="palet-hasil" autocomplete="off" placeholder="Cari tugas, agenda, halaman, atau ketik judul tugas baru"><kbd>Esc</kbd></div>
    <ul id="palet-hasil" role="listbox" aria-label="Hasil"></ul>
    <div class="palet-kaki"><span><kbd>↑</kbd><kbd>↓</kbd> pilih</span><span><kbd>Enter</kbd> buka</span></div>
  </div>`;
  renderDaftarPalet();
  $('#palet-q').focus();
}
function tutupPalet() { S.palet = false; const el = $('#palet'); el.hidden = true; el.innerHTML = ''; }
function jalankanPalet(i) {
  const h = hasilPalet(S.paletQ || '')[i];
  if (!h) return;
  tutupPalet();
  const a = h.aksi;
  if (a.tampil) { S.tampil = a.tampil; S.proyek = null; S.tab = 'daftar'; S.dipilih = null; render(); }
  else if (a.buka) buka(a.buka);
  else if (a.agenda) { const x = AGENDA.find((y) => y.id === a.agenda); S.draft = { ...x, peserta: [...x.peserta] }; S.dipilih = null; S.jurnalForm = null; S.agendaForm = true; render(); }
  else if (a.agendaBaru) { S.draft = { jenis: 'rapat', judul: '', tgl: HARI_INI, mulai: '09:00', selesai: '10:00', lokasi: '', tautan: '', peserta: ['MA'], catatan: '' }; S.dipilih = null; S.jurnalForm = null; S.agendaForm = true; render(); $('#a-judul')?.focus(); }
  else if ('baru' in a) { const t = tugasBaru({ judul: a.baru || 'Tugas baru' }); buka(t.kode); }
}

// ---------- Notifikasi ----------
function panelNotif() {
  const berikut = AGENDA.filter((a) => a.tgl === HARI_INI && a.mulai > JAM_KINI).sort(urutAgenda)[0];
  const menit = berikut ? (+berikut.mulai.slice(0, 2) * 60 + +berikut.mulai.slice(3)) - (+JAM_KINI.slice(0, 2) * 60 + +JAM_KINI.slice(3)) : 0;
  const nLewat = TUGAS.filter(lewat).length;
  const item = [
    berikut && `<button type="button" data-agenda="${berikut.id}"><span class="palet-ikon" style="--w:${JENIS[berikut.jenis].w}"><svg><use href="#${JENIS[berikut.jenis].ikon}"/></svg></span><span><b>${esc(berikut.judul)}</b><small>${menit} menit lagi · ${jam(berikut.mulai)}</small></span></button>`,
    nLewat && `<button type="button" data-saring-status="lewat"><span class="palet-ikon merah"><svg><use href="#seru"/></svg></span><span><b>${nLewat} tugas terlambat</b><small>Buka daftar yang terlambat</small></span></button>`,
    `<button type="button" data-buka="GRS-014"><span class="palet-ikon">${av('AR')}</span><span><b>Ayu R. berkomentar</b><small>“Rak tiba, 1 rak penyok…” · Pasang rak display</small></span></button>`,
  ].filter(Boolean);
  return `<div class="notif-panel" role="dialog" aria-label="Notifikasi"><div class="notif-judul">Notifikasi<span>${item.length} baru</span></div>${item.join('')}</div>`;
}

// ---------- Kontrol kustom: dropdown, tanggal, jam ----------
const REG = {};
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const tglRingkas = (tgl) => { const [y, m, d] = tgl.split('-'); return `${namaHari(tgl).slice(0, 3)}, ${+d} ${BULAN[+m - 1]}${y === HARI_INI.slice(0, 4) ? '' : ' ' + y}`; };
function kendali(id, { jenis, nilai, opsi = [], label, ikon = '', kelas = 'f-isian', onPilih }) {
  REG[id] = { jenis, nilai, opsi, label, onPilih };
  const pilihan = opsi.find((o) => o[0] === nilai);
  const tampil = jenis === 'pilih' ? (pilihan?.[1] ?? 'Pilih') : jenis === 'tanggal' ? tglRingkas(nilai) : jam(nilai);
  const titik = pilihan?.[2] ? `<span class="op-titik" style="--w:${pilihan[2]}"></span>` : '';
  return `<button type="button" class="${kelas} kendali" id="${id}" data-kendali="${id}" aria-haspopup="${jenis === 'pilih' ? 'listbox' : 'dialog'}" aria-expanded="${S.pop === id}" aria-label="${label}: ${tampil}">${ikon}${titik}<span class="kendali-nilai">${tampil}</span><svg class="pilih-ikon"><use href="#bawah-p"/></svg></button>`;
}
function kalenderPop(nilai) {
  const [y, m] = (S.popBulan || nilai.slice(0, 7)).split('-').map(Number);
  const awal = new Date(y, m - 1, 1);
  const offset = (awal.getDay() + 6) % 7;
  const jml = new Date(y, m, 0).getDate();
  const cepat = [['Hari ini', 0], ['Besok', 1], ['Lusa', 2], ['Pekan depan', 7]];
  const sel = Array.from({ length: offset }, () => '<span></span>').concat(Array.from({ length: jml }, (_, i) => {
    const t = ymd(new Date(y, m - 1, i + 1));
    return `<button type="button" data-tgl-pilih="${t}" class="${t === nilai ? 'on' : ''} ${t === HARI_INI ? 'ini' : ''}" aria-label="${tglPanjang(t)}" aria-pressed="${t === nilai}">${i + 1}</button>`;
  }));
  return `<div class="pop-kal" role="dialog" aria-label="Pilih tanggal">
    <div class="pop-kal-kepala"><button type="button" data-bulan-geser="-1" aria-label="Bulan sebelumnya"><svg><use href="#kembali"/></svg></button><b>${['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'][m - 1]} ${y}</b><button type="button" data-bulan-geser="1" aria-label="Bulan berikutnya"><svg style="transform:rotate(180deg)"><use href="#kembali"/></svg></button></div>
    <div class="pop-cepat">${cepat.map(([l, n]) => `<button type="button" data-tgl-pilih="${tambahHari(n)}">${l}</button>`).join('')}</div>
    <div class="pop-kal-hari">${['Sn', 'Sl', 'Rb', 'Km', 'Jm', 'Sb', 'Mg'].map((h) => `<span>${h}</span>`).join('')}</div>
    <div class="pop-kal-grid">${sel.join('')}</div>
  </div>`;
}
function jamPop(nilai) {
  const daftar = [];
  for (let h = 6; h <= 21; h++) for (const mnt of ['00', '30']) daftar.push(`${String(h).padStart(2, '0')}:${mnt}`);
  return `<div class="pop-jam" role="listbox" aria-label="Pilih jam">${daftar.map((j) => `<button type="button" role="option" data-jam-pilih="${j}" aria-selected="${j === nilai}" class="${j === nilai ? 'on' : ''}">${jam(j)}</button>`).join('')}</div>`;
}
function renderPop() {
  const el = $('#pop');
  const r = S.pop && REG[S.pop];
  if (!r || !document.querySelector(`[data-kendali="${S.pop}"]`)) { S.pop = null; el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.dataset.jenis = r.jenis;
  el.innerHTML = r.jenis === 'pilih'
    ? `<ul class="pop-daftar" role="listbox" aria-label="${r.label}">${r.opsi.map(([v, l, w], i) => `<li role="option" id="op-${i}" aria-selected="${v === r.nilai}" class="${i === S.popI ? 'aktif' : ''}" data-opsi="${i}">${w ? `<span class="op-titik" style="--w:${w}"></span>` : ''}<span>${l}</span>${v === r.nilai ? '<svg><use href="#cekbulat"/></svg>' : ''}</li>`).join('')}</ul>`
    : r.jenis === 'tanggal' ? kalenderPop(r.nilai) : jamPop(r.nilai);
  posisikanPop();
  el.querySelector('.pop-jam .on')?.scrollIntoView({ block: 'center' });
}
function posisikanPop() {
  const el = $('#pop');
  const tombol = document.querySelector(`[data-kendali="${S.pop}"]`);
  if (!tombol) return;
  const r = tombol.getBoundingClientRect();
  el.style.minWidth = Math.max(r.width, 200) + 'px';
  let top = r.bottom + 6;
  if (top + el.offsetHeight > innerHeight - 8) top = Math.max(8, r.top - el.offsetHeight - 6);
  el.style.top = top + 'px';
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - el.offsetWidth - 8)) + 'px';
}
function pilihPop(v) {
  const r = REG[S.pop];
  const id = S.pop;
  S.pop = null;
  renderPop();
  r.onPilih(v);
  document.getElementById(id)?.focus();
}
function ubahProp(t, k, v) {
  t[k] = v;
  if (k === 'p') t.ms = proyek(t.p).milestone[0];
  const label = { st: 'status', tgl: 'tenggat', pr: 'prioritas', p: 'proyek', ms: 'milestone' }[k];
  const nilai = k === 'p' ? proyek(t.p).nama : k === 'tgl' ? labelTgl(t, true).teks : besar(String(t[k]));
  catat(t, `mengubah ${label} ke <b>${esc(nilai)}</b>`);
  render();
}
window.addEventListener('scroll', () => { if (S.pop) posisikanPop(); }, true);
window.addEventListener('resize', () => { if (S.pop) posisikanPop(); });

  S.modal = { onYa, asal: document.activeElement };
  const el = $('#modal');
  el.hidden = false;
  el.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="modal-judul" aria-describedby="modal-isi">
    <span class="modal-ikon ${bahaya ? 'bahaya' : ''}"><svg><use href="#${bahaya ? 'seru' : 'cekbulat'}"/></svg></span>
    <h2 id="modal-judul">${judul}</h2><p id="modal-isi">${isi}</p>
    <div class="modal-aksi"><button type="button" class="m-batal" data-modal="batal">Batal</button><button type="button" class="m-ya ${bahaya ? 'bahaya' : ''}" data-modal="ya">${ya}</button></div>
  </div>`;
  el.querySelector('[data-modal="batal"]').focus();
}
function tutupModal() { const asal = S.modal?.asal; S.modal = null; const el = $('#modal'); el.hidden = true; el.innerHTML = ''; asal?.focus?.(); }

// ---------- Render ----------
function kepalaHalaman(ikon, daftar, label, cakupan = daftar) {
  const tot = daftar.length;
  const n = daftar.filter((t) => t.st === 'selesai').length;
  const pct = tot ? Math.round((n / tot) * 100) : 0;
  return {
    sampul: '<div class="sampul" aria-hidden="true"></div>',
    ikon: `<div class="ikon-hal" aria-hidden="true">${ikon}</div>`,
    hero: `<div class="hero"><div><small>Hai, Manajer</small><b>Selamat datang kembali</b><p>${cakupan.filter((t) => t.st === 'selesai').length} dari ${cakupan.length} tugas selesai${cakupan.filter(lewat).length ? ` · ${cakupan.filter(lewat).length} terlambat` : ''}</p><div class="bar"><i style="width:${cakupan.length ? Math.round((cakupan.filter((t) => t.st === 'selesai').length / cakupan.length) * 100) : 0}%"></i></div></div>${isoKoperasi()}</div>`,
    halo: `<div class="halo">${av('MA')}<div>Hai, Manajer<b>Selamat datang kembali</b></div></div>`,
    ubin: `<div class="ubin-status" role="group" aria-label="Saring menurut status">${[
      ['rencana', 'Rencana', 'semua', cakupan.filter((t) => t.st === 'rencana' && !lewat(t)).length],
      ['proses', 'Proses', 'jam', cakupan.filter((t) => t.st === 'proses' && !lewat(t)).length],
      ['lewat', 'Terlambat', 'seru', cakupan.filter(lewat).length],
      ['selesai', 'Selesai', 'cekbulat', cakupan.filter((t) => t.st === 'selesai').length],
    ].map(([k, l, i, n], idx) => {
      const tren = deret(7, n + (idx === 3 ? -3 : 2), n, 2, 5 + idx * 9); tren[6] = n;
      const ubah = n - tren[0];
      return `<button class="ubin u-${k}" type="button" data-saring-status="${k}" aria-pressed="${S.status === k}"><span class="atas-u"><span class="ikon-u"><svg><use href="#${i}"/></svg></span><span class="lbl-u">${l}</span></span><span class="bawah-u"><span class="angka-u">${n} <small>tugas</small></span>${spark(tren, 70, 30, 'currentColor')}</span><span class="delta-u">${ubah > 0 ? '▲' : ubah < 0 ? '▼' : '•'} ${Math.abs(ubah)} vs pekan lalu</span></button>`;
    }).join('')}</div>`,
    sapa: `<div class="sapa"><span class="cincin-besar" style="--p:${pct}" aria-hidden="true"></span><div><b>Selamat pagi</b><span>${n} dari ${tot} ${label} selesai</span></div><span class="persen">${pct}%</span></div>`,
  };
}
function renderSidebar() {
  // Kartu Tim: sumber daftar PIC; tautan ke /tim untuk menambah atau mengubah staf.
  const staf = Object.keys(ORANG);
  $('#sb-tim').innerHTML = `<div class="sb-judul">Tim</div><a class="takik-btn" href="#tim" aria-label="Kelola Tim"><svg><use href="#keluar"/></svg></a><div class="tumpuk-tim">${staf.map(av).join('')}</div><small class="sb-ket">${staf.length} staf · daftar pilihan PIC tugas</small>`;
  $('#sb-proyek').innerHTML = PROYEK.map((p) => `
    <button class="sb-i" type="button" data-tampil="proyek" data-proyek="${p.id}">${kp(p.id)}${p.nama}</button>
    ${S.tampil === 'proyek' && S.proyek === p.id ? `<div class="sb-anak">${p.milestone.map((m) => `<a class="sb-i" href="#">${m}</a>`).join('')}</div>` : ''}`).join('');
  document.querySelectorAll('.sb [data-tampil], .nav-pil [data-tampil], .nav-dok [data-tampil]').forEach((b) => {
    const aktif = b.dataset.tampil === S.tampil && (S.tampil !== 'proyek' || b.dataset.proyek === S.proyek);
    aktif ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
  });
  const buka = TUGAS.filter((t) => !tutupStatus(t));
  $('[data-hitung="hari"]').textContent = buka.filter((t) => t.tgl <= HARI_INI).length || '';
  $('[data-hitung="saya"]').textContent = buka.filter((t) => t.pic === 'MA').length || '';
  $('[data-hitung="semua"]').textContent = buka.filter((t) => !t.rutin).length || '';
  const rutin = TUGAS.filter((t) => t.rutin);
  $('[data-hitung="rutin"]').textContent = `${rutin.filter((t) => t.st === 'selesai').length}/${rutin.length}`;
  $('[data-hitung="agenda"]').textContent = AGENDA.filter((a) => a.tgl === HARI_INI).length || '';
}

function ringkasan(daftar) {
  const buka = daftar.filter((t) => !tutupStatus(t));
  const nLewat = buka.filter(lewat).length;
  const nDesak = buka.filter((t) => t.pr === 'mendesak').length;
  const minggu = daftar.filter((t) => t.st === 'selesai' && selisih(HARI_INI, t.tgl) < 7).length;
  return `${buka.length} terbuka${nLewat ? ` · <span class="m">${nLewat} terlambat</span>` : ''}`;
}

function renderBaris(t) {
  const tg = labelTgl(t);
  return `<div class="baris ${t.st === 'selesai' ? 'selesai' : ''} ${S.dipilih === t.kode ? 'pilih-ini' : ''}" data-buka="${t.kode}">
    ${cek(t)}
    <button class="judul" type="button"><span class="t">${esc(t.judul)}</span>${bendera(t)}</button>
    <span class="sel">${st(t.st)}</span>
    <span class="sel">${orang(t.pic)}</span>
    <span class="sel tgl ${tg.kls}">${tg.teks}</span>
    <span class="meta-hp">${st(t.st)}<span class="tgl ${tg.kls}">${tg.teks}</span>${av(t.pic)}</span>
    <span class="tag-kartu"><span class="tag ${t.pr}">${besar(t.pr)}</span><span class="tag ${t.st}">${besar(t.st)}</span></span>
    <span class="kaki-kartu"><span class="${tg.kls === 'lewat' ? 'lewat' : ''}"><svg><use href="#hari"/></svg>${tg.teks}</span>${t.sub.length ? `<span><svg><use href="#semua"/></svg>${t.sub.filter((x) => x.ok).length}/${t.sub.length}</span>` : ''}<span><svg><use href="#komen"/></svg>${t.akt.length}</span><span class="tumpuk">${[t.pic, ...(t.ikut || [])].slice(0, 3).map(av).join('')}${(t.ikut || []).length > 2 ? `<span class="av lebih">+${t.ikut.length - 2}</span>` : ''}</span></span>
    <button class="titik-menu" type="button" data-menu="${t.kode}" aria-haspopup="menu" aria-expanded="${S.menu === t.kode}" aria-label="Menu ${esc(t.judul)}"><svg><use href="#lainnya"/></svg></button>${S.menu === t.kode ? menuKartu(t) : ''}
  </div>`;
}

// Manajer perlu tahu urutan kerja, jadi kelompok bawaan memakai tenggat, bukan proyek.
function kunciTenggat(t) {
  if (tutupStatus(t)) return 'selesai';
  if (lewat(t)) return 'lewat';
  if (t.tgl === HARI_INI) return 'hari';
  return t.tgl <= tambahHari(7) ? 'minggu' : 'nanti';
}
function kelompokkan(daftar) {
  if (S.kelompok === 'tenggat') return [['lewat', 'Terlambat'], ['hari', 'Hari ini'], ['minggu', '7 hari ke depan'], ['nanti', 'Nanti'], ['selesai', 'Selesai']].map(([id, label]) => ({ id, label, ikon: '', isi: daftar.filter((t) => kunciTenggat(t) === id) }));
  if (S.kelompok === 'status') return STATUS.map((s) => ({ id: s, label: besar(s), ikon: st(s).replace(/>[A-Z][a-z]+</, '><'), isi: daftar.filter((t) => t.st === s) }));
  if (S.kelompok === 'pic') return Object.keys(ORANG).map((k) => ({ id: k, label: ORANG[k].nama, ikon: av(k), isi: daftar.filter((t) => t.pic === k) }));
  return PROYEK.map((p) => ({ id: p.id, label: p.nama, ikon: kp(p.id), isi: daftar.filter((t) => t.p === p.id) }));
}

  const daftar = tugasTerlihat();
  const judul = S.tampil === 'saya' ? 'Tugas saya' : S.tampil === 'rutin' ? 'Rutin harian' : S.tampil === 'proyek' ? proyek(S.proyek).nama : 'Semua tugas';

    const isi = g.isi.sort(urut);

    return `<section>
      <button class="grup-k" type="button" data-lipat="${g.id}" aria-expanded="${!tutup}"><span class="panah"><svg class="i" style="width:14px;height:14px"><use href="#bawah-p"/></svg></span>${g.ikon}${esc(g.label)}<span class="jml">${isi.length}</span></button>

      <div class="tabs" role="tablist" aria-label="Tampilan">
        ${[['daftar', 'Daftar'], ['papan', 'Papan'], ['kalender', 'Kalender'], ['gantt', 'Gantt']].map(([id, l]) => `<button class="tab" role="tab" type="button" data-tab="${id}" aria-selected="${S.tab === id}"><svg><use href="#${id === 'kalender' ? 'hari' : id}"/></svg>${l}</button>`).join('')}
      </div>
      <div class="kanan">
        ${kendali('kelompok', { jenis: 'pilih', nilai: S.kelompok, label: 'Kelompokkan', kelas: 'pilih', opsi: [['tenggat', 'Per tenggat'], ['proyek', 'Per proyek'], ['status', 'Per status'], ['pic', 'Per PIC']], onPilih: (v) => { S.kelompok = v; S.lipat = new Set(v === 'tenggat' ? ['selesai'] : []); render(); } })}
        <button class="baru" type="button" data-baru=""><svg class="i" style="width:15px;height:15px"><use href="#plus"/></svg>Baru</button>

}

let kunciTampilLalu = '';
function render() {
  renderSidebar();
  $('#notif').innerHTML = S.notif ? panelNotif() : '';
  $('[data-notif]').setAttribute('aria-expanded', !!S.notif);
  if (S.tampil === 'hari') renderBeranda();
  else if (S.tampil === 'agenda') renderAgenda();
  else renderDaftar();
  $('#lembar-baru').innerHTML = S.pilihBaru === 'fab' ? menuBaru() : '';
  $('#dok-fab')?.setAttribute('aria-expanded', S.pilihBaru === 'fab');
  renderPeek();
  renderPop();
  // Animasi masuk hanya ketika tampilan berganti, bukan setiap klik.
  const kunci = [S.tampil, S.proyek, S.tab, S.hariAgenda].join('|');

function catat(t, teks) { t.akt.unshift(['MA', teks, '18 Okt']); }
function buka(kode) { S.dipilih = kode; S.picBuka = false; S.agendaForm = false; S.jurnalForm = null; render(); }
function tutup() { S.dipilih = null; S.agendaForm = false; S.jurnalForm = null; render(); }
function geser(arah) {
  if (!S.dipilih) return;
  const i = urutanAktif.indexOf(S.dipilih);
  const j = Math.min(urutanAktif.length - 1, Math.max(0, i + arah));
  if (urutanAktif[j]) { buka(urutanAktif[j]); document.querySelector(`[data-buka="${S.dipilih}"]`)?.scrollIntoView({ block: 'nearest' }); }
}
function tugasBaru(data = {}) {
  const p = proyek(data.p || S.proyek || 'G');
  const no = Math.max(0, ...TUGAS.filter((t) => t.p === p.id).map((t) => +t.kode.split('-')[1])) + 1;
  const t = { kode: `${p.kode}-${String(no).padStart(3, '0')}`, judul: data.judul || 'Tugas baru', p: p.id, ms: p.milestone[0], pic: data.pic || 'MA', tgl: data.tgl || HARI_INI, st: 'rencana', pr: data.pr || 'normal', sub: [], akt: [['MA', 'membuat tugas', '18 Okt']] };
  TUGAS.push(t);
  return t;
}
function bacaCepat(teks) {
  const d = { judul: teks };
  d.judul = d.judul.replace(/@(\w+)/, (_, n) => { const k = Object.keys(ORANG).find((k) => ORANG[k].nama.toLowerCase().startsWith(n.toLowerCase()) || k === n.toUpperCase()); if (k) d.pic = k; return ''; });
  d.judul = d.judul.replace(/#(\w+)/, (_, n) => { const p = PROYEK.find((p) => p.nama.toLowerCase().includes(n.toLowerCase())); if (p) d.p = p.id; return ''; });
  d.judul = d.judul.replace(/!(\w+)/, (_, n) => { if (PRIO.includes(n.toLowerCase())) d.pr = n.toLowerCase(); return ''; });
  d.judul = d.judul.replace(/\b(besok|lusa|hari ini)\b/i, (m) => { d.tgl = tambahHari({ 'hari ini': 0, besok: 1, lusa: 2 }[m.toLowerCase()]); return ''; });
  d.judul = d.judul.replace(/\s+/g, ' ').trim();
  return d;
}

  if (!kol || !S.seret) return;
  e.preventDefault();
  document.querySelectorAll('.sasaran').forEach((x) => x !== kol && x.classList.remove('sasaran'));
  kol.classList.add('sasaran');
});
document.addEventListener('drop', (e) => {
  const kol = e.target.closest?.('[data-kolom]');
  if (!kol || !S.seret) return;
  e.preventDefault();
  const t = TUGAS.find((x) => x.kode === S.seret);
  const lama = t.st;
  S.seret = null;
  if (lama === kol.dataset.kolom) { render(); return; }
  t.st = kol.dataset.kolom;
  catat(t, `memindahkan ke <b>${besar(t.st)}</b>`);
  render();
  toast(`Dipindah ke ${besar(t.st)}: ${esc(t.judul)}`, () => { t.st = lama; render(); });
});
$('#tombol-laci').addEventListener('click', () => { document.body.classList.add('laci-buka'); $('#tombol-laci').setAttribute('aria-expanded', 'true'); });
$('#selubung').addEventListener('click', () => { document.body.classList.remove('laci-buka'); $('#tombol-laci').setAttribute('aria-expanded', 'false'); });

// Pengalih gaya hanya alat banding prototipe; pilihan diingat per peramban.
function pakaiGaya(nama) {
  document.body.dataset.gaya = nama === 'clay' || nama === 'lekuk' ? 'ceria' : nama;
  document.body.dataset.kulit = nama;
  document.querySelectorAll('.gaya [data-gaya]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.gaya === nama));
  try { localStorage.setItem('prototipe-gaya-4', nama); } catch {}
}
document.querySelector('.gaya').addEventListener('click', (e) => { const b = e.target.closest('.gaya [data-gaya]'); if (b) pakaiGaya(b.dataset.gaya); });
// Pengalih hanya untuk membandingkan: buka dengan ?banding.
if (location.search.includes('banding')) document.querySelector('.gaya').hidden = false;
let gayaAwal = 'lekuk';
try { if (location.search.includes('banding')) gayaAwal = localStorage.getItem('prototipe-gaya-4') || gayaAwal; } catch {}
pakaiGaya(gayaAwal);
render();
</script>
